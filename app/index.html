<title>PharmaLens Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* Layout: SaaS workspace. Fixed sidebar (wayfinding) + translucent top bar + content; sheets slide in from the right, command palette drops from top. */
:root{
  --bg:#F4F6FA; --side:#FFFFFF; --card:#FFFFFF; --ink:#0B1A3A; --ink2:#3A4256; --muted:#5E6472; --faint:#6B7180;
  --line:#E6E9F0; --line2:#F0F2F7; --hover:#F1F4FB; --accent:#2457E6; --accent-h:#1B44B8; --accent-soft:#EAF0FF; --accent-ink:#1F49C2;
  --navy:#0B1A3A; --navy2:#16306E; --logo:#0B1A3A;
  --off-bg:#E3F4E8; --off-fg:#1E6B37; --der-bg:#E6ECFD; --der-fg:#1F49C2; --gap-bg:#FCEBD9; --gap-fg:#8A4B10; --neu-bg:#EEF0F5; --neu-fg:#3A4256;
  --red-bg:#FDE7E7; --red-fg:#9B1C1C;
  --shadow:0 1px 2px rgba(11,26,58,.05),0 8px 24px rgba(11,26,58,.06);
  --shadow-lg:0 2px 6px rgba(11,26,58,.08),0 30px 80px rgba(11,26,58,.22);
  --bar:rgba(244,246,250,.78); --input:#FFFFFF; --scrim:rgba(11,26,58,.32);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070E1F; --side:#0B1530; --card:#0F1B36; --ink:#EEF2FB; --ink2:#C9D1E3; --muted:#A3ADC4; --faint:#8F9AB3;
  --line:#1D2946; --line2:#17223D; --hover:#15223F; --accent:#7B9CFF; --accent-h:#A4BBFF; --accent-soft:#17264B; --accent-ink:#A9C0FF;
  --navy:#0B1A3A; --navy2:#16306E; --logo:#EEF2FB;
  --off-bg:#123A22; --off-fg:#8FE0A8; --der-bg:#1A2C5E; --der-fg:#A9C0FF; --gap-bg:#3D2610; --gap-fg:#F5B979; --neu-bg:#1D2946; --neu-fg:#C9D1E3;
  --red-bg:#3F1616; --red-fg:#F7A3A3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 30px 80px rgba(0,0,0,.6);
  --bar:rgba(7,14,31,.78); --input:#0B1530; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070E1F; --side:#0B1530; --card:#0F1B36; --ink:#EEF2FB; --ink2:#C9D1E3; --muted:#A3ADC4; --faint:#8F9AB3;
  --line:#1D2946; --line2:#17223D; --hover:#15223F; --accent:#7B9CFF; --accent-h:#A4BBFF; --accent-soft:#17264B; --accent-ink:#A9C0FF;
  --navy:#0B1A3A; --navy2:#16306E; --logo:#EEF2FB;
  --off-bg:#123A22; --off-fg:#8FE0A8; --der-bg:#1A2C5E; --der-fg:#A9C0FF; --gap-bg:#3D2610; --gap-fg:#F5B979; --neu-bg:#1D2946; --neu-fg:#C9D1E3;
  --red-bg:#3F1616; --red-fg:#F7A3A3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 30px 80px rgba(0,0,0,.6);
  --bar:rgba(7,14,31,.78); --input:#0B1530; --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color 300ms ease,color 300ms ease}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-h)}
h1,h2,h3{margin:0;text-wrap:balance}p{margin:0;text-wrap:pretty}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;color:var(--logo)}
.logo:hover{color:var(--logo)}
.logo .word{font-size:20px;font-weight:600;letter-spacing:-.025em}
.logo .tag{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:999px;margin-left:2px}
.kbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:10px;transition:transform 100ms ease-out}
.kbtn:active{transform:scale(.98)}
.kbtn kbd,.kbd{margin-left:auto;font:600 11.5px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--card)}
.navgroup{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.navlabel{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 12px 6px}
.navitem{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:var(--ink2);font-weight:550;font-size:14.5px;transition:background-color 120ms ease,transform 100ms ease-out}
.navitem:hover{background:var(--hover);color:var(--ink)}
.navitem:active{transform:scale(.98)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.navitem svg{flex:none;opacity:.9}
.navitem .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.navitem[aria-current="page"] .count{color:var(--accent-ink)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.pilot{padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#F5F5F7}
.pilot b{display:block;font-size:14px}.pilot span{font-size:12.5px;color:#B8C2D9}
.themebtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:none;background:none;color:var(--ink2);font-size:14px;font-weight:550;cursor:pointer}
.themebtn:hover{background:var(--hover)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(var(--bar),transparent);pointer-events:none}
@media (min-width:900px){.topbar{padding-left:32px;padding-right:32px}}
.menubtn{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center;cursor:pointer;flex:none}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:650;overflow:hidden;text-overflow:ellipsis;text-transform:none}
.topsearch{margin-left:auto;position:relative;flex:0 1 340px;min-width:0}
.topsearch input{width:100%;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--ink);padding:0 12px 0 38px;font:inherit;font-size:14.5px}
.topsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.content{padding:8px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:1320px;width:100%}
@media (min-width:900px){.content{padding:8px 32px 56px}}

/* mobile: sidebar becomes a sheet from the left */
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:40;left:0;top:0;width:min(300px,86vw);transform:translateX(-104%);transition:transform 380ms cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .menubtn{display:flex}
  .topsearch{flex-basis:200px}
}

/* ---------- primitives ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 22px}
.page-head h1{font-size:clamp(26px,3vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:700}
.page-head p{margin-top:6px;color:var(--muted);font-size:15px;max-width:640px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform 100ms ease-out,background-color 150ms ease}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;line-height:1.6}
.c-official{background:var(--off-bg);color:var(--off-fg)}.c-derived{background:var(--der-bg);color:var(--der-fg)}
.c-gap{background:var(--gap-bg);color:var(--gap-fg)}.c-neutral,.c-secondary{background:var(--neu-bg);color:var(--neu-fg)}
.c-red{background:var(--red-bg);color:var(--red-fg)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.cc{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--neu-bg);color:var(--neu-fg);font-size:11.5px;font-weight:700;letter-spacing:.03em}
.note{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--neu-bg);flex-wrap:wrap}
.seg button{min-height:34px;padding:0 12px;border:none;border-radius:9px;background:none;color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;transition:background-color 120ms ease}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(11,26,58,.12)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.field{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}
.toolbar input.field{flex:1 1 220px;min-width:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:550}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.kpi small{display:block;font-size:12.5px;color:var(--faint);margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.panel{padding:20px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-h h2{font-size:17px;letter-spacing:-.01em}
.panel-h a{font-size:13.5px;font-weight:600}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
.tbl table{min-width:760px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:focus-visible{outline:2px solid var(--accent);border-radius:4px}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
td.main{color:var(--ink);font-weight:600}
tr.click{cursor:pointer;transition:background-color 100ms ease}
tr.click:hover{background:var(--hover)}
tr.click:active{background:var(--accent-soft)}
.cap{text-transform:capitalize}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--line2)}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13.5px}
.bar .lbl{display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;background:var(--neu-bg);border-radius:99px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--accent);border-radius:99px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--neu-bg)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* detail */
.dhead{padding:24px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.dhead h1{font-size:clamp(30px,3.6vw,42px);letter-spacing:-.035em;line-height:1.05;text-transform:capitalize}
.ids{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.ids b{color:var(--ink2);font-weight:650}
.summary{margin-top:14px;font-size:15px;color:var(--ink2);max-width:780px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:20px 0 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{flex:none;min-height:42px;padding:0 12px;border:none;background:none;color:var(--muted);font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:11.5px;background:var(--neu-bg);color:var(--muted);padding:0 7px;border-radius:999px;line-height:1.7}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.site{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:16px 18px;cursor:pointer;background:var(--card);border-radius:16px;border:1px solid var(--line2);box-shadow:var(--shadow);transition:transform 100ms ease-out,border-color 150ms ease}
.site:hover{border-color:var(--accent)}
.site:active{transform:scale(.98)}
.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.site h3{font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.site .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.quote{padding:12px 14px;background:var(--bg);border-radius:12px;font-size:12.5px;white-space:pre-line;color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line2)}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}

/* sheet (right) + palette */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 260ms ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);box-shadow:var(--shadow-lg);transform:translateX(104%);transition:transform 380ms cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:20px;letter-spacing:-.02em}
.sheet-b{padding:18px 20px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-left:auto;transition:transform 100ms ease-out}
.iconbtn:active{transform:scale(.94)}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;color:var(--ink)}
.palette{position:fixed;z-index:70;left:50%;top:12vh;width:min(640px,calc(100vw - 32px));transform:translateX(-50%) translateY(-8px) scale(.98);opacity:0;pointer-events:none;transition:transform 260ms cubic-bezier(.2,.9,.25,1),opacity 180ms ease;background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden;transform-origin:top center}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.palette .pin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.palette input{flex:1;min-height:56px;border:none;background:none;color:var(--ink);font:inherit;font-size:17px;outline:none}
.plist{max-height:min(420px,60vh);overflow-y:auto;padding:8px}
.pgroup{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 10px;border:none;background:none;border-radius:10px;text-align:left;cursor:pointer;font-size:14.5px;color:var(--ink)}
.pitem small{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.pitem[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.picon{width:28px;height:28px;border-radius:8px;background:var(--neu-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.pfoot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

.skeleton{border-radius:18px;background:linear-gradient(90deg,var(--neu-bg),var(--line2),var(--neu-bg));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fadein 240ms ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .side,.sheet,.palette{transition:opacity 180ms ease}
  .sheet{transform:none;opacity:0;pointer-events:none}.sheet.on{opacity:1;pointer-events:auto}
  .side{transform:none;opacity:0;pointer-events:none}@media (max-width:899px){.side.open{opacity:1;pointer-events:auto}}
  .fade,.skeleton{animation:none}
}
@media (prefers-reduced-transparency:reduce){.topbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (min-width:900px) and (prefers-reduced-motion:reduce){.side{opacity:1;pointer-events:auto}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="pmask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="112">
      <rect width="100" height="112" fill="#fff"/>
      <line x1="30" y1="63" x2="66" y2="32" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      <circle cx="30" cy="63" r="12" fill="#000"/><circle cx="66" cy="32" r="12" fill="#000"/>
    </mask>
  </defs>
</svg>

<div class="app">
  <aside class="side" id="side" aria-label="Navigation">
    <a class="logo" href="#overview" aria-label="PharmaLens Übersicht">
      <svg width="24" height="27" viewBox="0 0 100 112" aria-hidden="true"><path d="M0 0H58a42 42 0 0 1 0 84H40v28H0Z" fill="currentColor" mask="url(#pmask)"/></svg>
      <span class="word">PharmaLens</span><span class="tag">PILOT</span>
    </a>
    <button class="kbtn" type="button" id="openPalette" aria-label="Alles durchsuchen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      Suchen …<kbd id="kbdHint">⌘K</kbd>
    </button>
    <nav class="navgroup" aria-label="Arbeitsbereich">
      <div class="navlabel">Arbeitsbereich</div>
      <a class="navitem" href="#overview" data-nav="overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Übersicht</a>
      <a class="navitem" href="#apis" data-nav="apis"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4v6l5 9a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l5-9z"/><path d="M8 15h8"/></svg>Wirkstoffe<span class="count num" id="nApis"></span></a>
      <a class="navitem" href="#companies" data-nav="companies"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V10l6 4V10l6 4V6l6 4v11z"/></svg>Firmen<span class="count num" id="nComp"></span></a>
      <a class="navitem" href="#markets" data-nav="markets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Märkte<span class="count num" id="nMk"></span></a>
    </nav>
    <nav class="navgroup" aria-label="Datenqualität">
      <div class="navlabel">Datenqualität</div>
      <a class="navitem" href="#gaps" data-nav="gaps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Lücken<span class="count num" id="nGaps"></span></a>
      <a class="navitem" href="#sources" data-nav="sources"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Quellen<span class="count num" id="nSrc"></span></a>
    </nav>
    <div class="sidefoot">
      <div class="pilot"><b>Pilot · 20 Wirkstoffe</b><span id="stand">Datenstand –</span></div>
      <button class="themebtn" type="button" id="themeBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeLbl">Dunkelmodus</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menubtn" type="button" id="menuBtn" aria-label="Navigation öffnen" aria-controls="side" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Pfad"></nav>
      <div class="topsearch">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="pageq" class="sr">Auf dieser Seite filtern</label>
        <input id="pageq" type="search" placeholder="Auf dieser Seite filtern" autocomplete="off">
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"><div class="skeleton" style="height:160px;margin-top:16px"></div></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><div style="min-width:0"><p class="note" id="sheetEyebrow"></p><h2 id="sheetTitle"></h2></div>
    <button class="iconbtn" type="button" id="sheetClose" aria-label="Schliessen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
</aside>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Suche">
  <div class="pin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--faint)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label for="pq" class="sr">Wirkstoffe, Hersteller und Märkte durchsuchen</label>
    <input id="pq" type="text" placeholder="Wirkstoff, Hersteller, Land …" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="plist">
    <span class="kbd">esc</span></div>
  <div class="plist" id="plist" role="listbox"></div>
  <div class="pfoot"><span>↑↓ auswählen</span><span>↵ öffnen</span><span>esc schliessen</span></div>
</div>

<script>
(function(){
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => n == null ? '–' : Number(n).toLocaleString('de-CH');
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };
  const GROUP = {blockbuster:'Blockbuster', niche:'Nische', veterinary:'Tierarzneimittel', patent:'Patent / SPC'};
  const STATUS = {official:'Offiziell', secondary:'Sekundär', derived:'Abgeleitet', gap:'Lücke'};
  const chip = st => `<span class="chip c-${esc(st)}"><span class="dot"></span>${esc(STATUS[st] || st)}</span>`;
  const link = (url, label) => url && /^https?:/.test(url) ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label || 'Quelle')} ↗</a>` : `<span class="note">${esc(label || 'intern')}</span>`;
  const has = (o, q) => !q || Object.values(o).some(v => String(v ?? '').toLowerCase().includes(q.toLowerCase()));
  const shortSrc = s => String(s || '').replace(/ (Listen|REST|Open Data|Geneesmiddeleninformatiebank|Arzneispezialitätenregister|Medicine data download|Article-57-Datenbank)$/,'').replace('EMA Article-57','EMA Art. 57');

  // ---------- data ----------
  const D = {}; const API = {};
  const j = async p => (await fetch(p)).json();
  async function data(){ if (!D.index) { const [i,c,m,s,g,x] = await Promise.all([j('apis.json'), j('companies.json'), j('markets.json'), j('sources.json'), j('gaps.json'), j('search.json')]);
      Object.assign(D, {index:i, companies:c, markets:m, sources:s, gaps:g, search:x}); } return D; }
  async function api(slug){ if (!API[slug]) API[slug] = await j(`api/${slug}.json`); return API[slug]; }

  // ---------- theme ----------
  const isDark = () => (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const setThemeLbl = () => $('#themeLbl').textContent = isDark() ? 'Hellmodus' : 'Dunkelmodus';
  const saved = store.get('pl-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); setThemeLbl();
  $('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store.set('pl-theme', t); setThemeLbl(); });

  // ---------- shell: mobile nav, sheet, palette ----------
  const side = $('#side'), scrim = $('#scrim'), sheet = $('#sheet'), pal = $('#palette');
  let layer = null;
  function openLayer(name){ layer = name; scrim.classList.add('on'); if (name==='nav') { side.classList.add('open'); $('#menuBtn').setAttribute('aria-expanded','true'); } if (name==='sheet') sheet.classList.add('on'); if (name==='pal') pal.classList.add('on'); }
  function closeLayer(){ scrim.classList.remove('on'); side.classList.remove('open'); sheet.classList.remove('on'); pal.classList.remove('on'); $('#menuBtn').setAttribute('aria-expanded','false'); const was = layer; layer = null; return was; }
  scrim.addEventListener('click', closeLayer);
  $('#menuBtn').addEventListener('click', () => openLayer('nav'));
  side.addEventListener('click', e => { if (e.target.closest('a.navitem,a.logo') && layer === 'nav') closeLayer(); });
  $('#sheetClose').addEventListener('click', closeLayer);
  function showSheet(eyebrow, title, body){ $('#sheetEyebrow').textContent = eyebrow; $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = body; $('#sheetBody').scrollTop = 0; openLayer('sheet'); setTimeout(() => $('#sheetClose').focus(), 50); }

  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent); $('#kbdHint').textContent = mac ? '⌘K' : 'Ctrl K';
  let pItems = [], pSel = 0;
  function openPalette(){ closeLayer(); openLayer('pal'); $('#pq').value = ''; renderPalette(); setTimeout(() => $('#pq').focus(), 30); }
  $('#openPalette').addEventListener('click', openPalette);
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); layer === 'pal' ? closeLayer() : openPalette(); }
    else if (e.key === 'Escape' && layer) { closeLayer(); }
    else if (e.key === '/' && !layer && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openPalette(); }
  });
  async function renderPalette(){
    const d = await data(); const q = $('#pq').value.trim().toLowerCase();
    const pages = [['overview','Übersicht'],['apis','Wirkstoffe'],['companies','Hersteller'],['markets','Märkte'],['gaps','Lücken'],['sources','Quellen']];
    const g = [];
    const A = d.index.apis.filter(a => !q || [a.inn,a.unii,a.cas,a.atc].some(x => (x||'').toLowerCase().includes(q))).slice(0, 6)
      .map(a => ({icon:'API', label:a.inn, cap:true, sub:`${a.countries} Länder · ${fmt(a.products)} Produkte`, go:'#api-'+a.slug}));
    const C = q ? findCompanies(d.search, q).slice(0, 7).map(([c, why]) => ({icon:(c.cc||'–'), label:c.n, sub:why || compSub(c), company:c.id})) : [];
    const M = q ? d.markets.filter(m => m.name.toLowerCase().includes(q) || m.cc.toLowerCase() === q).slice(0, 4).map(m => ({icon:m.cc, label:m.name, sub:`${fmt(m.products)} Produkte`, go:'#markets', market:m.cc})) : [];
    const P = pages.filter(([,l]) => !q || l.toLowerCase().includes(q)).map(([k,l]) => ({icon:'→', label:l, sub:'Seite', go:'#'+k}));
    if (A.length) g.push(['Wirkstoffe', A]); if (C.length) g.push(['Hersteller', C]); if (M.length) g.push(['Märkte', M]); if (P.length) g.push(['Seiten', P]);
    pItems = g.flatMap(x => x[1]); pSel = 0;
    let i = 0;
    $('#plist').innerHTML = pItems.length ? g.map(([name, items]) => `<div class="pgroup">${name}</div>` + items.map(it => `<button class="pitem" type="button" role="option" data-i="${i++}" aria-selected="false">
        <span class="picon" style="font-size:${it.icon.length>2?10:11}px;font-weight:700">${esc(it.icon)}</span><span class="${it.cap?'cap':''}">${esc(it.label)}</span><small>${esc(it.sub)}</small></button>`).join('')).join('')
      : `<div class="empty">Kein Treffer für «${esc(q)}». Im Pilot sind 20 Wirkstoffe, ${fmt(d.companies.length)} Hersteller und ${d.markets.length} Märkte.</div>`;
    markSel();
  }
  function findCompanies(list, q){
    const out = [];
    for (const c of list) {
      const n = c.n.toLowerCase(); let score = 0, why = '';
      if (n.startsWith(q)) score = 4; else if (n.includes(q)) score = 3;
      else { const a = c.al.find(x => x.toLowerCase().includes(q)); if (a) { score = 2; why = `auch: ${a}`; }
        else if ((c.p||'').toLowerCase().includes(q)) { score = 1; why = `Konzern ${c.p} (GLEIF)`; }
        else if ((c.g||'').toLowerCase().includes(q)) { score = 1; why = `Markengruppe ${c.g} (abgeleitet)`; } }
      if (score) out.push([c, why, score]);
    }
    return out.sort((a, b) => b[2] - a[2] || b[0].w - a[0].w);
  }
  function compSub(c){ const k = c.k || {}; return [k.foreign_released ? `${fmt(k.foreign_released)} Lohnfertigungen` : '', k.released ? `${fmt(k.released)} Chargenfreigaben` : '', k.mah_products ? `${fmt(k.mah_products)} eigene Zulassungen` : ''].filter(Boolean).join(' · ') || ROLE_SHORT[c.r[0]] || 'Firma'; }
  function markSel(){ document.querySelectorAll('.pitem').forEach(b => b.setAttribute('aria-selected', +b.dataset.i === pSel)); const s = document.querySelector(`.pitem[data-i="${pSel}"]`); if (s) s.scrollIntoView({block:'nearest'}); }
  function pick(i){ const it = pItems[i]; if (!it) return; closeLayer(); if (it.company) { location.hash = 'co-' + it.company; } else { if (it.market) state.marketQ = it.market; location.hash = it.go.slice(1); if (location.hash === it.go) route(); } }
  $('#pq').addEventListener('input', renderPalette);
  $('#pq').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); pSel = Math.min(pItems.length-1, pSel+1); markSel(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); pSel = Math.max(0, pSel-1); markSel(); }
    if (e.key === 'Enter') { e.preventDefault(); pick(pSel); }
  });
  $('#plist').addEventListener('pointerdown', e => { const b = e.target.closest('.pitem'); if (b) { pSel = +b.dataset.i; markSel(); } });
  $('#plist').addEventListener('click', e => { const b = e.target.closest('.pitem'); if (b) pick(+b.dataset.i); });

  // ---------- page state ----------
  const state = { q:'', group:'all', sort:['products', -1], compRole:'all', compCc:'', srcLight:'all', limit:60, tab:'sites', cc:'', marketQ:'' };
  const view = $('#view');
  const pageq = $('#pageq');
  pageq.addEventListener('input', () => { state.q = pageq.value; state.limit = 60; renderCurrent(true); });
  function crumbs(parts){ $('#crumbs').innerHTML = parts.map((p, i) => i < parts.length - 1 ? `<a href="${p[1]}">${esc(p[0])}</a><span aria-hidden="true">/</span>` : `<b class="${p[2]||''}">${esc(p[0])}</b>`).join(''); }
  function setNav(k){ document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === k ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current')); }
  function moreBtn(shown, total){ return total > shown ? `<div class="more"><button class="btn" type="button" data-more>Weitere ${fmt(Math.min(60, total-shown))} anzeigen <span class="note">(${fmt(total-shown)} übrig)</span></button></div>` : ''; }
  view.addEventListener('click', e => {
    if (e.target.closest('[data-more]')) { state.limit += 60; renderCurrent(); return; }
    const sortB = e.target.closest('[data-sort]'); if (sortB) { const k = sortB.dataset.sort; state.sort = [k, state.sort[0] === k ? -state.sort[1] : -1]; renderCurrent(); return; }
    const row = e.target.closest('[data-href]'); if (row && !e.target.closest('a,button')) { location.hash = row.dataset.href; return; }
    const comp = e.target.closest('[data-company]'); if (comp && !e.target.closest('a')) { location.hash = 'co-' + comp.dataset.company; return; }
    const xl = e.target.closest('[data-xlsx]'); if (xl) { exportXlsx(xl.dataset.xlsx); return; }
    const seg = e.target.closest('[data-seg]'); if (seg) { state[seg.dataset.seg] = seg.dataset.val; state.limit = 60; renderCurrent(); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { state.tab = tab.dataset.tab; state.cc = ''; state.limit = 60; renderCurrent(); return; }
    const site = e.target.closest('[data-site]'); if (site) { siteSheet(site.dataset.site); return; }
  });
  view.addEventListener('keydown', e => { const row = e.target.closest('[data-href],[data-company]'); if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); } });
  view.addEventListener('change', e => { if (e.target.dataset.fld) { state[e.target.dataset.fld] = e.target.value; state.limit = 60; renderCurrent(); } });

  // ---------- pages ----------
  let current = () => {};
  function renderCurrent(keep){ current(keep); }

  async function pOverview(){
    const d = await data(); const t = d.totals; const A = d.index.apis;
    crumbs([['Übersicht']]); setNav('overview');
    const leaflet = d.markets.filter(m => m.leaflet_products > 0).map(m => ({...m, cov: pct(m.with_mfr, m.products)})).sort((a,b) => b.cov - a.cov);
    const linkTot = t.confirmed + t.derived;
    const topGaps = d.gaps.slice(0, 5);
    const q = state.q.toLowerCase();
    const rows = A.filter(a => !q || a.inn.includes(q)).sort((a,b) => b.products - a.products).slice(0, 8);
    view.innerHTML = `<div class="fade">
      <div class="page-head"><div><h1>Übersicht</h1><p>Stand ${esc(d.index.generated)}. Jeder Wert ist mit seiner Quelle verknüpft; was fehlt, steht unter Lücken.</p></div>
        <button class="btn btn-primary" type="button" id="ovSearch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Wirkstoff suchen</button></div>
      <div class="kpis">
        <div class="card kpi"><span>Fertigprodukte</span><b class="num">${fmt(t.products)}</b><small>in ${t.countries} Ländern plus EU-zentral</small></div>
        <div class="card kpi"><span>Herstellerangaben aus Leaflets</span><b class="num">${fmt(t.sites)}</b><small>Batch-Release, mit Zitat</small></div>
        <div class="card kpi"><span>Hersteller</span><b class="num">${fmt(t.companies)}</b><small>Werke und API-Hersteller</small></div>
        <div class="card kpi"><span>API-Zertifikate</span><b class="num">${fmt(t.dmf)}</b><small>US-DMF; CEP folgt</small></div>
        <div class="card kpi"><span>Offene Lücken</span><b class="num">${fmt(t.gaps)}</b><small>jede mit Grund</small></div>
      </div>
      <div class="grid2">
        <section class="card panel"><div class="panel-h"><h2>Wirkstoffe nach Produktzahl</h2><a href="#apis">Alle ${A.length} anzeigen</a></div>
          <div class="tbl" style="margin:0 -20px -20px"><table><thead><tr><th>Wirkstoff</th><th>Gruppe</th><th>Länder</th><th>Produkte</th><th>Werke</th><th>Engpässe</th></tr></thead><tbody>
          ${rows.map(a => `<tr class="click" data-href="api-${a.slug}" tabindex="0"><td class="main cap">${esc(a.inn)}</td><td><span class="chip c-neutral">${esc(GROUP[a.group]||'')}</span></td>
            <td class="num">${a.countries}</td><td class="num">${fmt(a.products)}</td><td class="num">${fmt(a.sites)}</td><td>${a.shortages ? `<span class="chip c-gap">${a.shortages} offen</span>` : '<span class="note">–</span>'}</td></tr>`).join('')}
          </tbody></table></div></section>
        <div style="display:flex;flex-direction:column;gap:16px">
          <section class="card panel"><div class="panel-h"><h2>Lieferkette</h2><span class="note num">${fmt(linkTot)} Verbindungen</span></div>
            <div class="stack" role="img" aria-label="${fmt(t.confirmed)} bestätigt, ${fmt(t.derived)} abgeleitet"><i style="width:${pct(t.confirmed,linkTot)}%;background:var(--off-fg)"></i><i style="width:${pct(t.derived,linkTot)}%;background:var(--accent)"></i></div>
            <div class="legend"><span><i class="sw" style="background:var(--off-fg)"></i>Bestätigt <b class="num">${fmt(t.confirmed)}</b></span><span><i class="sw" style="background:var(--accent)"></i>Abgeleitet <b class="num">${fmt(t.derived)}</b></span></div>
            <p class="note" style="margin-top:10px">Werk → Produkt aus Leaflets. API-Lieferanten chemischer Generika sind meist nicht öffentlich und bleiben offen.</p></section>
          <section class="card panel"><div class="panel-h"><h2>Hersteller-Abdeckung</h2><a href="#markets">Alle Märkte</a></div>
            <div class="bars">${leaflet.map(m => `<div class="bar"><span class="lbl"><span class="cc">${esc(m.cc)}</span>${esc(m.name)}</span><div class="track"><div class="fill" style="width:${m.cov}%"></div></div><span class="num" style="text-align:right">${m.cov} %</span></div>`).join('')}</div>
            <p class="note" style="margin-top:10px">Anteil Produkte mit Batch-Release-Werk aus dem Leaflet.</p></section>
        </div>
      </div>
      <section class="card panel" style="margin-top:16px"><div class="panel-h"><h2>Grösste Lücken</h2><a href="#gaps">Alle Lücken</a></div>
        <div class="tbl" style="margin:0 -20px -20px"><table><thead><tr><th>Bereich</th><th>Grund</th><th>Anzahl</th></tr></thead><tbody>
        ${topGaps.map(g => `<tr><td><span class="chip c-gap">${esc(AREA[g.area]||g.area)}</span></td><td class="main" style="font-weight:550">${esc(g.reason)}</td><td class="num">${fmt(g.n)}</td></tr>`).join('')}</tbody></table></div></section>
    </div>`;
    $('#ovSearch').addEventListener('click', openPalette);
  }
  const AREA = {manufacturer:'Hersteller', certificate:'Zertifikat', patent:'Patent', supply_chain:'Lieferkette', product:'Zulassung', company_structure:'Konzern', source:'Quelle'};

  function sortHead(key, label){ const [k, dir] = state.sort; return `<th><button type="button" data-sort="${key}" aria-label="Nach ${label} sortieren">${label}${k===key ? (dir<0?' ↓':' ↑') : ''}</button></th>`; }
  function sortBy(arr){ const [k, dir] = state.sort; return [...arr].sort((a,b) => { const x = a[k], y = b[k]; return (typeof x === 'string' ? String(x||'').localeCompare(String(y||'')) : (x||0) - (y||0)) * dir; }); }

  async function pApis(keep){

        <p class="note" style="font-weight:600;color:var(--accent-ink)">Firma 360</p><h1>${esc(c.name)}</h1>
        <div class="ids"><span><b>Land</b> ${c.cc ? `<span class="cc">${esc(c.cc)}</span>` : '–'}${c.cc_basis ? ` <span class="note">${esc(c.cc_basis)}</span>` : ''}</span><span><b>LEI</b> ${esc(c.lei||'–')}</span><span><b>Konzern</b> ${grp}</span></div>
        <div style="margin-top:10px">${c.roles.map(r => roleChip(r.role)).join('')}${cdmo && cdmo.group_unverified ? ' <span class="chip c-gap">Konzern ungeprüft</span>' : ''}</div>
        ${cdmo ? `<p class="summary">${esc(cdmo.rationale)}${cdmo.group_unverified ? ' Für diese Firma ist keine Konzernmutter im GLEIF-Register hinterlegt. Freigaben für Schwesterfirmen können darum als Lohnfertigung erscheinen.' : ''}</p>` : ''}
      </div></section>
      <div class="kpis" style="margin-top:12px">
        <div class="card kpi"><span>Lohnfertigung</span><b class="num">${fmt(k.foreign_released)}</b><small>Produkte konzernfremder Inhaber</small></div>
        <div class="card kpi"><span>Kunden</span><b class="num">${fmt(k.customers)}</b><small>Zulassungsinhaber (abgeleitet)</small></div>
        <div class="card kpi"><span>Chargenfreigaben</span><b class="num">${fmt(k.released)}</b><small>aus Packungsbeilagen</small></div>
        <div class="card kpi"><span>Eigene Zulassungen</span><b class="num">${fmt(k.mah_products)}</b><small>in ${fmt(k.markets)} Märkten</small></div>
        <div class="card kpi"><span>US-DMF</span><b class="num">${fmt(k.dmf)}</b><small>Typ II Wirkstoff</small></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Bereiche">${CTABS.map(([t,l]) => `<button class="tab" role="tab" type="button" data-ctab="${t}" aria-selected="${state.ctab===t}">${l}<span class="n num">${fmt(counts[t])}</span></button>`).join('')}</div>
      <div id="tabpanel"></div></div>`;
    view.querySelectorAll('[data-ctab]').forEach(b => b.addEventListener('click', () => { state.ctab = b.dataset.ctab; state.cc = ''; state.limit = 60; pCompany(id, true); }));
    renderCTab(c);
  }

  function ctabRows(c){
    const q = state.q, cc = state.cc;
    const rel = c.manufacturing.filter(r => (!cc || r.cc === cc));
    if (state.ctab === 'cdmo') return rel.filter(r => r.foreign && has({p:r.product, m:r.mah, s:r.subst}, q));
    if (state.ctab === 'release') return rel.filter(r => has({p:r.product, m:r.mah, s:r.subst}, q));
    if (state.ctab === 'mah') return c.as_mah.filter(p => (!cc || p.cc === cc) && has({p:p.name, s:p.subst, n:p.no}, q));
    if (state.ctab === 'customers') return c.customers.filter(x => has({m:x.mah}, q));
    if (state.ctab === 'dmf') return c.dmf.filter(x => has(x, q));
    return c.aliases.filter(x => has({a:x.a}, q));
  }

  function renderCTab(c){
    const el = $('#tabpanel'); const rows = ctabRows(c); const L = state.limit;
    const ccs = [...new Set((state.ctab === 'mah' ? c.as_mah : c.manufacturing).map(r => r.cc))].filter(Boolean).sort();
    const ccSel = ['cdmo','release','mah'].includes(state.ctab) ? `<label for="ctcc" class="sr">Markt</label><select id="ctcc" class="field" data-fld="cc"><option value="">Alle Märkte</option>${ccs.map(x => `<option ${state.cc===x?'selected':''}>${esc(x)}</option>`).join('')}</select>` : '';
    const bar = `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px">
      <p class="note" style="margin:0">${fmt(rows.length)} Zeilen${state.ctab==='cdmo' ? ' · Freigabe für Zulassungsinhaber ausserhalb des eigenen Konzerns. Abgeleitet aus Packungsbeilagen, nicht durch Verträge bestätigt.' : ''}</p>
      <div style="display:flex;gap:10px">${ccSel}<button class="btn" type="button" data-xlsx="${state.ctab}" ${rows.length?'':'disabled'}>Excel exportieren</button></div></div>`;
    let body = '';
    if (!rows.length) body = `<div class="empty">Keine Einträge${state.ctab==='cdmo' ? '. Diese Firma gibt in den angebundenen Packungsbeilagen nur Produkte des eigenen Konzerns frei, oder die Märkte sind noch nicht angebunden.' : '.'}</div>`;
    else if (state.ctab === 'cdmo' || state.ctab === 'release') body = `<table><thead><tr><th>Markt</th><th>Produkt</th><th>Wirkstoff</th><th>Zulassungsinhaber</th><th>Werk</th><th>Status</th><th>Beleg</th></tr></thead><tbody>
      ${rows.slice(0, L).map((r, i) => `<tr><td><span class="cc">${esc(r.cc)}</span></td><td class="main">${esc(r.product)}</td><td class="cap">${esc(r.subst||'–')}</td>
        <td>${esc(r.mah||'–')}${r.foreign ? '' : ' <span class="chip c-neutral">Konzern</span>'}</td><td>${r.site_cc ? `<span class="cc">${esc(r.site_cc)}</span>` : '–'}</td>
        <td>${chip(r.foreign && state.ctab==='cdmo' ? 'derived' : r.st)}</td><td><button class="btn" type="button" data-quote="${i}">Zitat</button> ${link(r.leaflet, 'Leaflet')}</td></tr>`).join('')}</tbody></table>`;
    else if (state.ctab === 'customers') body = `<table><thead><tr><th>Zulassungsinhaber</th><th>Produkte</th><th>Märkte</th><th>Status</th></tr></thead><tbody>
      ${rows.slice(0, L).map(x => `<tr><td class="main">${esc(x.mah)}</td><td class="num">${fmt(x.products)}</td><td>${x.cc.map(z => `<span class="cc" style="margin:1px">${esc(z)}</span>`).join(' ')}</td><td>${chip('derived')}</td></tr>`).join('')}</tbody></table>`;
    else if (state.ctab === 'mah') body = `<table><thead><tr><th>Markt</th><th>Produkt</th><th>Wirkstoff</th><th>Zulassung</th><th>Datum</th><th>Status</th><th>Quelle</th></tr></thead><tbody>
      ${rows.slice(0, L).map(p => `<tr><td><span class="cc">${esc(p.cc)}</span></td><td class="main">${esc(p.name)}</td><td class="cap">${esc(p.subst||'–')}</td><td class="num">${esc(p.no||'–')}</td><td class="num">${esc(p.date||'–')}</td><td>${chip(p.st)}</td><td>${link(p.src)}</td></tr>`).join('')}</tbody></table>`;
    else if (state.ctab === 'dmf') body = `<table><thead><tr><th>Wirkstoff</th><th>DMF</th><th>Status</th><th>Eingereicht</th><th>Quelle</th></tr></thead><tbody>
      ${rows.slice(0, L).map(x => `<tr><td class="main cap">${esc(x.api||'–')}</td><td class="num">${esc(x.no)}</td><td>${esc(x.cs||'–')}</td><td class="num">${esc(x.date||'–')}</td><td>${link(x.src)} ${chip(x.st)}</td></tr>`).join('')}</tbody></table>`;
    else body = `<table><thead><tr><th>Name / Schreibweise</th><th>Art</th><th>Gesehen</th><th>Quellen</th><th>Status</th></tr></thead><tbody>
      ${rows.slice(0, L).map(x => `<tr><td class="main">${esc(x.a)}</td><td>${esc({legal_name:'Häufigste Schreibweise',spelling:'Variante',gleif_other_name:'GLEIF-Name',transliteration:'Transliteration',brand_group:'Markengruppe'}[x.k]||x.k)}</td><td class="num">${fmt(x.n)}</td><td class="note">${esc((x.src||[]).map(shortSrc).join(', '))}</td><td>${chip(x.st)}</td></tr>`).join('')}</tbody></table>
      ${c.children.length ? `<h3 style="font-size:15px;margin:18px 0 8px">Töchter laut GLEIF</h3><table><tbody>${c.children.map(x => `<tr class="click" data-company="${x.id}" tabindex="0"><td class="main">${esc(x.name)}</td><td>${link(x.source_url, 'GLEIF')} ${chip(x.status)}</td></tr>`).join('')}</tbody></table>` : ''}`;
    el.innerHTML = bar + `<section class="card tbl">${body}${moreBtn(Math.min(L, rows.length), rows.length)}</section>`;
    el.querySelectorAll('[data-quote]').forEach(b => b.addEventListener('click', () => { const r = rows[+b.dataset.quote];
      showSheet(`${r.cc} · ${r.mah||''}`, r.product, `<div><h3 style="font-size:15px;margin-bottom:8px">Wörtlich aus der Packungsbeilage</h3><div class="quote">${esc(r.quote)}</div>
        <p style="margin-top:8px">${link(r.leaflet, 'Leaflet öffnen')} · ${link(r.src, 'Rohquelle')}</p></div>
        <dl class="dl"><dt>Rolle</dt><dd>${r.role === 'batch_release' ? 'Chargenfreigabe' : esc(r.role)}</dd><dt>Konzernfremd</dt><dd>${r.foreign ? 'ja ' + chip('derived') : 'nein'}</dd><dt>Status Zeile</dt><dd>${chip(r.st)}</dd></dl>`); }));
  }

  let xlsxLib;
  async function exportXlsx(tab){
    const id = +location.hash.slice(4); const c = COMP[id]; if (!c) return;
    if (!xlsxLib) xlsxLib = await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = no; document.head.appendChild(s); });
    const rows = ctabRows(c); const today = new Date().toISOString().slice(0, 10);
    const M = {
      cdmo: r => ({Markt:r.cc, Produkt:r.product, Wirkstoff:r.subst, Zulassungsinhaber:r.mah, Werk_Land:r.site_cc, Konzernfremd:r.foreign?'ja':'nein', Status:'derived', Zitat:r.quote, Leaflet:r.leaflet, Quelle:r.src}),
      release: r => ({Markt:r.cc, Produkt:r.product, Wirkstoff:r.subst, Zulassungsinhaber:r.mah, Werk_Land:r.site_cc, Konzernfremd:r.foreign?'ja':'nein', Status:r.st, Zitat:r.quote, Leaflet:r.leaflet, Quelle:r.src}),
      customers: x => ({Zulassungsinhaber:x.mah, Produkte:x.products, Maerkte:x.cc.join(', '), Status:'derived'}),
      mah: p => ({Markt:p.cc, Produkt:p.name, Wirkstoff:p.subst, Zulassung:p.no, Datum:p.date, Status:p.st, Quelle:p.src}),
      dmf: x => ({Wirkstoff:x.api, DMF:x.no, DMF_Status:x.cs, Eingereicht:x.date, Status:x.st, Quelle:x.src}),
      identity: x => ({Name:x.a, Art:x.k, Gesehen:x.n, Quellen:(x.src||[]).join(', '), Status:x.st}) };
    const wb = xlsxLib.utils.book_new();
    xlsxLib.utils.book_append_sheet(wb, xlsxLib.utils.json_to_sheet(rows.map(M[tab])), tab.slice(0, 31));
    xlsxLib.utils.book_append_sheet(wb, xlsxLib.utils.aoa_to_sheet([['Firma', c.name], ['LEI', c.lei||''], ['Export', today], ['Bereich', CTABS.find(t => t[0]===tab)[1]],
      ['Hinweis', 'derived = abgeleitet, nicht bestätigt. Jede Zeile mit Quelle. Quelle: PharmaLens, öffentliche Register.']]), 'Info');
    xlsxLib.writeFile(wb, `PharmaLens_${c.name.replace(/[^A-Za-z0-9]+/g,'_').slice(0,40)}_${tab}_${today}.xlsx`);
  }

  async function pMarkets(keep){
    const d = await data(); crumbs([['Märkte']]); setNav('markets');
    if (state.marketQ) { state.q = state.marketQ; pageq.value = state.marketQ; state.marketQ = ''; }
    const q = state.q.toLowerCase();
    const M = d.markets.filter(m => !q || m.name.toLowerCase().includes(q) || m.cc.toLowerCase() === q);
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Märkte</h1><p>Zulassungen der Pilot-Wirkstoffe je Land. Hersteller pro Produkt gibt es dort, wo ein Leaflet-Register angebunden ist.</p></div></div>
      <section class="card tbl"><table><thead><tr><th>Markt</th><th>Produkte</th><th>Zulassungsinhaber</th><th>Wirkstoffe</th><th style="min-width:220px">Hersteller pro Produkt</th><th>Quellen</th></tr></thead><tbody>
      ${M.map(m => { const cov = pct(m.with_mfr, m.products); return `<tr><td class="main"><span class="cc">${esc(m.cc)}</span> ${esc(m.name)}</td><td class="num">${fmt(m.products)}${m.vet?` <span class="note">(${m.vet} vet)</span>`:''}</td><td class="num">${fmt(m.mahs)}</td><td class="num">${m.apis}</td>
        <td>${m.with_mfr ? `<div style="display:flex;align-items:center;gap:10px"><div class="track" style="flex:1"><div class="fill" style="width:${cov}%"></div></div><span class="num" style="width:44px;text-align:right">${cov} %</span></div>` : '<span class="chip c-gap">nur Register</span>'}</td>
        <td class="note">${m.sources.map(shortSrc).join(', ')}</td></tr>`; }).join('')}
      </tbody></table></section></div>`;
  }

  async function pGaps(keep){
    const d = await data(); crumbs([['Lücken']]); setNav('gaps');
    const q = state.q;
    const G = d.gaps.filter(g => has(g, q)); const byArea = {}; G.forEach(g => byArea[g.area] = (byArea[g.area]||0) + g.n);
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Lücken</h1><p>Was fehlt und warum. Lücken werden nie mit geschätzten Werten gefüllt.</p></div></div>
      <div class="kpis">${Object.entries(byArea).sort((a,b) => b[1]-a[1]).map(([k,n]) => `<div class="card kpi"><span>${esc(AREA[k]||k)}</span><b class="num">${fmt(n)}</b></div>`).join('')}</div>
      <section class="card tbl" style="margin-top:16px"><table><thead><tr><th>Bereich</th><th>Grund</th><th>Fälle</th><th>Wo erhältlich</th></tr></thead><tbody>
      ${G.map(g => `<tr><td><span class="chip c-gap">${esc(AREA[g.area]||g.area)}</span></td><td class="main" style="font-weight:550">${esc(g.reason)}</td><td class="num">${fmt(g.n)}</td><td>${/^https?:/.test(g.where||'') ? link(g.where,'Beispiel') : esc(g.where||'–')}</td></tr>`).join('')}
      </tbody></table></section></div>`;
  }

  async function pSources(keep){
    const d = await data(); crumbs([['Quellen']]); setNav('sources');
    const q = state.q; const LIGHT = {green:['Download / API','c-official'], yellow:['HTML erlaubt','c-gap'], red:['Nicht nutzbar','c-red']};
    const cnt = {green:0,yellow:0,red:0}; d.sources.forEach(s => cnt[s.light]++);
    const S = d.sources.filter(s => (state.srcLight === 'all' || s.light === state.srcLight) && has({n:s.name,j:s.jur,r:s.reason,c:s.cat}, q));
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Quellen</h1><p>Jede Quelle mit Zugriffsart, robots.txt-Prüfung und Nutzungsbedingungen. Gesperrte Quellen werden nicht umgangen.</p></div>
        <div class="seg" role="group" aria-label="Ampel">${[['all',`Alle ${d.sources.length}`],['green',`Grün ${cnt.green}`],['yellow',`Gelb ${cnt.yellow}`],['red',`Rot ${cnt.red}`]].map(([k,l]) => `<button type="button" data-seg="srcLight" data-val="${k}" aria-pressed="${state.srcLight===k}">${l}</button>`).join('')}</div></div>
      <section class="card tbl"><table><thead><tr><th>Ampel</th><th>Quelle</th><th>Land</th><th>Zugriff</th><th>Befund</th><th>Rhythmus</th></tr></thead><tbody>
      ${S.map(s => `<tr><td><span class="chip ${LIGHT[s.light][1]}"><span class="dot"></span>${LIGHT[s.light][0]}</span></td><td class="main">${link(s.url, s.name.replace(/^ALT /,''))}${s.name.startsWith('ALT ')?' <span class="chip c-neutral">Ersatzweg</span>':''}</td><td><span class="cc">${esc(s.jur||'–')}</span></td><td>${esc(s.access||'–')}</td><td class="note" style="min-width:260px">${esc(s.reason)}</td><td>${esc(s.freq||'–')}</td></tr>`).join('')}
      </tbody></table></section></div>`;
  }

  // ---------- routing ----------
  async function route(){
    closeLayer();
    const h = location.hash.replace('#','') || 'overview';
    const prevPage = route.page; let page = h.startsWith('api-') ? 'api' : h.startsWith('co-') ? 'co' : h;
    if (page !== prevPage || page === 'api' || page === 'co') { state.q = ''; pageq.value = ''; state.limit = 60; state.sort = ['products', -1]; }
    if (page === 'api' && prevPage !== 'api') { state.tab = 'sites'; state.cc = ''; }
    if (page === 'co') { state.ctab = 'cdmo'; state.cc = ''; }
    route.page = page;
    const map = { overview:pOverview, apis:pApis, companies:pCompanies, markets:pMarkets, gaps:pGaps, sources:pSources };
    pageq.placeholder = { overview:'Wirkstoff filtern', apis:'Wirkstoff, UNII, CAS, ATC', companies:'Firma, Alias, Konzern', co:'Produkt, Zulassungsinhaber, Wirkstoff', markets:'Land', gaps:'Grund', sources:'Quelle oder Land', api:'Firma, Produkt, Nummer' }[page] || 'Auf dieser Seite filtern';
    if (page === 'api') current = keep => pApi(h.slice(4), keep);
    else if (h.startsWith('co-')) { current = keep => pCompany(+h.slice(3), keep); page = 'co'; }
    else current = map[page] || pOverview;
    await current();
    window.scrollTo(0, 0);
  }
  data().then(d => {
    $('#nApis').textContent = d.index.apis.length; $('#nComp').textContent = fmt(d.search.length); $('#nMk').textContent = d.markets.length;
    $('#nGaps').textContent = fmt(d.index.totals.gaps); $('#nSrc').textContent = d.sources.length; $('#stand').textContent = 'Datenstand ' + d.index.generated;
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
