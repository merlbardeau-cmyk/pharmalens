<title>PharmaLens</title>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* PharmaLens design system. Native-Mac feel: neutral surfaces, small precise type, blue only for interaction.
   Tokens first; every rule below reads tokens only. Type sizes in rem so browser text scaling works (1rem = 16px). */
:root{
  /* colour */
  --navy:#0B1E3B; --accent:#3B6FD8; --accent-h:#2F5BB8; --accent-ink:#2F5BB8; --accent-soft:rgba(59,111,216,.10);
  --bg:#F7F8FB; --side:#FAFBFD; --card:#FFFFFF; --surface2:#F1F3F8; --input:#FFFFFF;
  --ink:#111827; --ink2:#344054; --muted:#667085; --faint:#8A94A6; --logo:#0B1E3B;
  --line:rgba(15,23,42,.06); --line-strong:rgba(15,23,42,.10); --line2:rgba(15,23,42,.045); --hover:rgba(15,23,42,.04); --press:rgba(15,23,42,.07);
  --off-fg:#1E7A46; --off-bg:rgba(30,122,70,.09); --der-fg:#2F5BB8; --der-bg:rgba(59,111,216,.09);
  --gap-fg:#965A12; --gap-bg:rgba(217,119,6,.11); --neu-fg:#475467; --neu-bg:rgba(15,23,42,.05); --red-fg:#B42318; --red-bg:rgba(217,45,32,.09);
  --bar:rgba(247,248,251,.78); --scrim:rgba(15,23,42,.18);
  --shadow:0 1px 2px rgba(15,23,42,.04); --shadow-pop:0 1px 2px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.12); --shadow-lg:0 2px 8px rgba(15,23,42,.06),0 24px 64px rgba(15,23,42,.18);
  /* type */
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',sans-serif; --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
  --fs-2xs:.625rem; --fs-xs:.6875rem; --fs-s:.75rem; --fs-m:.8125rem; --fs-h3:.875rem; --fs-kpi:1.3125rem; --fs-h1:1.375rem;
  /* space, radius */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:28px;
  --r-xs:5px; --r-s:7px; --r-m:10px; --r-l:16px; --r-full:999px;
  /* motion: critically damped spring approximations */
  --spring:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1); --t-press:90ms; --t-fast:140ms; --t-panel:360ms;
  /* layers */
  --z-bar:15; --z-side:40; --z-scrim:50; --z-sheet:60; --z-pal:70;
  --side-w:220px; --bar-h:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:#6F98F0; --accent-h:#90B0F5; --accent-ink:#9DBAF7; --accent-soft:rgba(111,152,240,.15);
  --bg:#0B1220; --side:#0D1524; --card:#111A2B; --surface2:#162135; --input:#0F1828;
  --ink:#E6EBF4; --ink2:#C2CBDA; --muted:#8F9BB0; --faint:#76829A; --logo:#E6EBF4;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.11); --line2:rgba(255,255,255,.05); --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --off-fg:#7FD3A0; --off-bg:rgba(127,211,160,.11); --der-fg:#9DBAF7; --der-bg:rgba(111,152,240,.14);
  --gap-fg:#F2B26B; --gap-bg:rgba(242,178,107,.12); --neu-fg:#B4BED0; --neu-bg:rgba(255,255,255,.06); --red-fg:#F7A39B; --red-bg:rgba(247,163,155,.12);
  --bar:rgba(11,18,32,.78); --scrim:rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#6F98F0; --accent-h:#90B0F5; --accent-ink:#9DBAF7; --accent-soft:rgba(111,152,240,.15);
  --bg:#0B1220; --side:#0D1524; --card:#111A2B; --surface2:#162135; --input:#0F1828;
  --ink:#E6EBF4; --ink2:#C2CBDA; --muted:#8F9BB0; --faint:#76829A; --logo:#E6EBF4;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.11); --line2:rgba(255,255,255,.05); --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --off-fg:#7FD3A0; --off-bg:rgba(127,211,160,.11); --der-fg:#9DBAF7; --der-bg:rgba(111,152,240,.14);
  --gap-fg:#F2B26B; --gap-bg:rgba(242,178,107,.12); --neu-fg:#B4BED0; --neu-bg:rgba(255,255,255,.06); --red-fg:#F7A39B; --red-bg:rgba(247,163,155,.12);
  --bar:rgba(11,18,32,.78); --scrim:rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-s);line-height:1.5;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01"}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-h)}
a[target="_blank"]{white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}p{margin:0;text-wrap:pretty}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
.num,td.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{text-transform:capitalize}.nw{white-space:nowrap}
::selection{background:var(--accent-soft)}

/* ---------- AppShell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:14px 10px calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;color:var(--logo)}
.logo:hover{color:var(--logo)}
.logo svg{width:18px;height:20px}
.logo .word{font-size:var(--fs-h3);font-weight:650;letter-spacing:-.02em}
.logo .tag{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-strong);padding:0 5px;border-radius:var(--r-xs);line-height:1.6}
.kbtn{display:flex;align-items:center;gap:7px;width:100%;height:28px;padding:0 6px 0 8px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);color:var(--faint);font-size:var(--fs-s);cursor:pointer;margin-bottom:8px;box-shadow:var(--shadow);transition:background-color var(--t-fast) ease,transform var(--t-press) ease-out}
.kbtn:hover{color:var(--muted)}
.kbtn:active{transform:scale(.985);background:var(--surface2)}
.kbtn svg{width:13px;height:13px}
.kbtn kbd,.kbd{margin-left:auto;font:500 var(--fs-2xs) var(--font);color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;line-height:1.5;background:transparent}
.navgroup{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.navlabel{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.02em;color:var(--faint);padding:10px 8px 4px}
.navitem{position:relative;display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-s);color:var(--ink2);font-weight:500;font-size:var(--fs-s);transition:background-color var(--t-fast) ease}
.navitem::before{content:"";position:absolute;inset:-2px 0}  /* taller invisible hit target */
.navitem:hover{background:var(--hover);color:var(--ink)}
.navitem:active{background:var(--press)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navitem svg{flex:none;width:15px;height:15px;color:var(--muted)}
.navitem[aria-current="page"] svg{color:var(--accent)}
.navitem .count{margin-left:auto;font-size:var(--fs-xs);color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.navitem[aria-current="page"] .count{color:var(--accent-ink)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.pilot{padding:9px 10px;border-radius:var(--r-m);background:var(--surface2);border:1px solid var(--line)}
.pilot b{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--ink)}
.pilot b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--off-fg)}
.pilot span{display:block;font-size:var(--fs-2xs);color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.themebtn{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-s);border:none;background:none;color:var(--ink2);font-size:var(--fs-s);font-weight:500;cursor:pointer;transition:background-color var(--t-fast) ease}
.themebtn svg{width:15px;height:15px;color:var(--muted)}
.themebtn:hover{background:var(--hover)}.themebtn:active{background:var(--press)}

.main{min-width:0;display:flex;flex-direction:column}
/* Topbar: translucent material, scroll-edge fade instead of a hard divider */
.topbar{position:sticky;top:0;z-index:var(--z-bar);display:flex;align-items:center;gap:var(--s3);height:var(--bar-h);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--bar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
@media (min-width:900px){.topbar{padding:0 28px}}
.menubtn{display:none;width:30px;height:30px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center;cursor:pointer;flex:none}
.menubtn svg{width:15px;height:15px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-m);color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--ink)}
.crumbs span{color:var(--faint)}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.topsearch{margin-left:auto;position:relative;flex:0 1 260px;min-width:0}
.topsearch input{width:100%;height:28px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:0 10px 0 28px;font-size:var(--fs-s);box-shadow:var(--shadow);transition:border-color var(--t-fast) ease,box-shadow var(--t-fast) ease}
.topsearch input::placeholder{color:var(--faint)}
.topsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topsearch svg{position:absolute;left:9px;top:50%;width:12px;height:12px;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.content{padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:1360px;width:100%}
@media (min-width:900px){.content{padding:24px 28px 56px}}

@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:var(--z-side);left:0;top:0;width:min(260px,86vw);transform:translateX(-104%);transition:transform var(--t-panel) var(--spring);box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .menubtn{display:flex}
  .topsearch{flex-basis:180px}
}

/* ---------- PageHeader ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin:0 0 var(--s5)}
.page-head h1{font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.022em;font-weight:600}
.page-head p{margin-top:4px;color:var(--muted);font-size:var(--fs-s);max-width:680px}
.page-head p.week{font-size:var(--fs-m);color:var(--ink);font-weight:500}

/* ---------- SurfaceCard, buttons, StatusBadge ---------- */
.card{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-s);font-size:var(--fs-s);font-weight:500;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;transition:background-color var(--t-fast) ease,transform var(--t-press) ease-out}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.97);background:var(--press)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-primary{background:var(--accent);border-color:transparent;color:#fff}.btn-primary:hover{background:var(--accent-h);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:var(--r-xs);font-size:var(--fs-2xs);font-weight:500;white-space:nowrap;line-height:1.75;letter-spacing:.005em;vertical-align:1px}
a.chip:hover{filter:brightness(.97)}
.c-official{background:var(--off-bg);color:var(--off-fg)}.c-derived{background:var(--der-bg);color:var(--der-fg)}
.c-gap{background:var(--gap-bg);color:var(--gap-fg)}.c-neutral,.c-secondary{background:var(--neu-bg);color:var(--neu-fg)}
.c-red{background:var(--red-bg);color:var(--red-fg)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.cc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:16px;padding:0 4px;border-radius:4px;background:var(--neu-bg);color:var(--neu-fg);font-size:var(--fs-2xs);font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.note{font-size:var(--fs-xs);color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-s);background:var(--neu-bg);flex-wrap:wrap}
.seg button{height:24px;padding:0 9px;border:none;border-radius:5px;background:none;color:var(--ink2);font-size:var(--fs-s);font-weight:500;cursor:pointer;transition:background-color var(--t-fast) ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.10),0 0 0 .5px var(--line-strong)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s3)}
.field{height:28px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--input);color:var(--ink);padding:0 8px;font-size:var(--fs-s);box-shadow:var(--shadow)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar input.field{flex:1 1 220px;min-width:0}

/* ---------- MetricCard ---------- */
.kpib{font:inherit;text-align:left;cursor:pointer;color:inherit;transition:transform var(--t-press) ease-out,border-color var(--t-fast) ease}
.kpib:hover{border-color:var(--line-strong)}.kpib:active{transform:scale(.985)}
.kpib b .chip{font-size:var(--fs-xs);vertical-align:4px}
.kpi b .chip,.kpi small .chip{display:inline-flex}
.tbl.scroll{overflow-x:auto}.tbl.scroll th{position:static}
table.dense td,table.dense th{padding-left:9px;padding-right:9px}
.seg a.segl{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:5px;color:var(--ink2);font-size:var(--fs-s);font-weight:500}
.seg a.segl:hover{color:var(--ink)}
.seg a.segl[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.10),0 0 0 .5px var(--line-strong)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.kpi{padding:14px 16px}
.kpi span{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:var(--fs-kpi);font-weight:600;letter-spacing:-.02em;margin-top:2px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:var(--fs-xs);color:var(--faint);margin-top:2px;line-height:1.35}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s4)}
@media (max-width:1100px){.grid2{grid-template-columns:1fr !important}}
.panel{padding:var(--s4)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3);min-height:24px}
.panel-h h2{font-size:var(--fs-h3);letter-spacing:-.01em}
.panel-h a{font-size:var(--fs-s);font-weight:500}

/* ---------- DataTable ---------- */
.tbl{overflow-x:auto}
@media (min-width:1100px){.tbl{overflow:visible}}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-s)}
.tbl table{min-width:720px}
th{position:sticky;top:var(--bar-h);z-index:2;background:var(--card);text-align:left;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.card > table th:first-child,.tbl > table th:first-child{border-top-left-radius:var(--r-l)}
.card > table th:last-child,.tbl > table th:last-child{border-top-right-radius:var(--r-l)}
.panel .tbl th,.sheet th{position:static}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
th button:hover{color:var(--ink2)}
th button:focus-visible{outline:2px solid var(--accent);border-radius:3px}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
td.main{color:var(--ink);font-weight:500;max-width:380px}
td.main,.clamp{display:table-cell}
td.main{overflow-wrap:break-word;min-width:96px}
td .chip{max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr.click{cursor:pointer;transition:background-color var(--t-fast) ease}
tr.click:hover{background:var(--hover)}
tr.click:active{background:var(--press)}
.more{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line2)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:var(--fs-s)}

/* ---------- bars & legends ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:var(--s2);align-items:center;font-size:var(--fs-s)}
.bars.wide .bar{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px}
.bars.wide .lbl a{overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bars.wide .lbl a:hover{color:var(--accent)}
.bar .lbl{display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:6px;background:var(--neu-bg);border-radius:var(--r-full);overflow:hidden;display:flex}
.fill{height:100%;background:var(--accent);border-radius:var(--r-full)}
.stack{display:flex;gap:2px;height:8px;border-radius:var(--r-full);overflow:hidden;background:var(--neu-bg)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:var(--fs-xs);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.sig-row{display:flex;gap:8px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line2)}
.sig-row:last-child{border-bottom:none}
.sig-t{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detail pages ---------- */
.dhead{padding:var(--s5);display:flex;flex-wrap:wrap;gap:var(--s4);justify-content:space-between;align-items:flex-start}
.dhead h1{font-size:var(--fs-h1);letter-spacing:-.022em;line-height:1.2}
.eyebrow{font-size:var(--fs-xs);font-weight:500;color:var(--muted);margin-bottom:2px}
.ids{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:var(--fs-s);color:var(--muted)}
.ids b{color:var(--ink2);font-weight:600}
.summary{margin-top:var(--s3);font-size:var(--fs-s);color:var(--ink2);max-width:820px;padding:10px 12px;border-radius:var(--r-m);background:var(--surface2);line-height:1.55}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:var(--s5) 0 var(--s3);border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{position:relative;flex:none;height:32px;padding:0 10px;border:none;background:none;color:var(--muted);font-size:var(--fs-s);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;border-radius:var(--r-s) var(--r-s) 0 0;transition:color var(--t-fast) ease,background-color var(--t-fast) ease}
.tab:hover{color:var(--ink);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:var(--fs-2xs);background:var(--neu-bg);color:var(--muted);padding:0 5px;border-radius:var(--r-xs);line-height:1.6;font-variant-numeric:tabular-nums}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s2)}
.site{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:12px 14px;cursor:pointer;background:var(--card);border-radius:var(--r-m);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--t-press) ease-out,border-color var(--t-fast) ease}
.site:hover{border-color:var(--line-strong)}
.site:active{transform:scale(.985)}
.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.site h3{font-size:var(--fs-s);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:var(--fs-xs);color:var(--muted)}
.quote{padding:10px 12px;background:var(--surface2);border-radius:var(--r-m);font-size:var(--fs-xs);white-space:pre-line;color:var(--ink2);font-family:var(--mono);border:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s4);align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.h3{font-size:var(--fs-s);font-weight:600;margin-bottom:6px;color:var(--ink)}

/* ---------- sheet (right) + command palette ---------- */
.scrim{position:fixed;inset:0;z-index:var(--z-scrim);background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--t-panel) var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:var(--z-sheet);top:8px;right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));background:var(--card);border-radius:var(--r-l);border:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 16px));transition:transform var(--t-panel) var(--spring);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:flex-start;gap:var(--s3);padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:var(--fs-h3);letter-spacing:-.01em}
.sheet-b{padding:14px 16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s4)}
.iconbtn{position:relative;width:26px;height:26px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-left:auto;transition:transform var(--t-press) ease-out,background-color var(--t-fast) ease}
.iconbtn::after{content:"";position:absolute;inset:-8px}
.iconbtn svg{width:12px;height:12px}
.iconbtn:hover{background:var(--surface2)}.iconbtn:active{transform:scale(.92)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:var(--fs-s)}
.dl dt{color:var(--muted)}.dl dd{margin:0;color:var(--ink)}
.palette{position:fixed;z-index:var(--z-pal);left:50%;top:14vh;width:min(560px,calc(100vw - 32px));transform:translateX(-50%) scale(.97);opacity:0;pointer-events:none;transition:transform 300ms var(--spring),opacity 160ms ease;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line-strong);overflow:hidden;transform-origin:var(--pal-origin,50% 0)}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.palette .pin{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.palette .pin svg{width:15px;height:15px}
.palette input{flex:1;height:46px;border:none;background:none;color:var(--ink);font-size:var(--fs-h3);outline:none}
.palette input::placeholder{color:var(--faint)}
.plist{max-height:min(380px,58vh);overflow-y:auto;padding:6px}
.pgroup{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.02em;color:var(--faint);padding:8px 8px 3px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:none;background:none;border-radius:var(--r-s);text-align:left;cursor:pointer;font-size:var(--fs-s);color:var(--ink)}
.pitem > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{color:var(--muted);font-size:var(--fs-xs);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.pitem[aria-selected="true"]{background:var(--accent);color:#fff}
.pitem[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.pitem[aria-selected="true"] .picon{background:rgba(255,255,255,.18);color:#fff}
.picon{width:22px;height:22px;border-radius:var(--r-xs);background:var(--neu-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2);font-size:var(--fs-2xs) !important;font-weight:600 !important}
.pfoot{display:flex;gap:14px;padding:7px 14px;border-top:1px solid var(--line);font-size:var(--fs-2xs);color:var(--faint)}

.skeleton{border-radius:var(--r-l);background:linear-gradient(90deg,var(--neu-bg),var(--line2),var(--neu-bg));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fadein 220ms var(--ease-out) both}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- accessibility preferences ---------- */
@media (prefers-reduced-motion:reduce){
  .side,.sheet,.palette{transition:opacity 160ms ease}
  .sheet{transform:none;opacity:0;pointer-events:none}.sheet.on{opacity:1;pointer-events:auto}
  .palette,.palette.on{transform:translateX(-50%)}
  .side{transform:none;opacity:0;pointer-events:none}@media (max-width:899px){.side.open{opacity:1;pointer-events:auto}}
  .fade,.skeleton{animation:none}
  .btn:active,.kbtn:active,.site:active,.iconbtn:active{transform:none}
}
@media (min-width:900px) and (prefers-reduced-motion:reduce){.side{opacity:1;pointer-events:auto}}
@media (prefers-reduced-transparency:reduce){.topbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}.palette{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (prefers-contrast:more){:root{--line:rgba(15,23,42,.2);--line2:rgba(15,23,42,.14);--muted:#475467;--faint:#5B6475}.card,.btn,.field{border-color:var(--ink2)}}
@media (forced-colors:active){.chip,.cc{border:1px solid CanvasText}}

<script>
(function(){
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };
  const GROUP = {blockbuster:'Blockbuster', niche:'Niche', veterinary:'Veterinary', patent:'Patent / SPC'};
  const STATUS = {official:'Official', secondary:'Secondary', derived:'Derived', gap:'Gap'};
  const TIP = {official:'Taken 1:1 from an official register or document', secondary:'From a secondary source', derived:'Inferred by PharmaLens from register data – not confirmed', gap:'Not available – see Gaps for the reason'};
  const chip = st => `<span class="chip c-${esc(st)}" title="${esc(TIP[st] || '')}"><span class="dot"></span>${esc(STATUS[st] || st)}</span>`;
  const link = (url, label) => url && /^https?:/.test(url) ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(label || 'Source')} ↗</a>` : `<span class="note">${esc(label || 'internal')}</span>`;
  const has = (o, q) => !q || Object.values(o).some(v => String(v ?? '').toLowerCase().includes(q.toLowerCase()));
  const shortSrc = s => String(s || '').replace(/ (Listen|REST|Open Data|Geneesmiddeleninformatiebank|Arzneispezialitätenregister|Medicine data download|Article-57-Datenbank)$/,'').replace('EMA Article-57','EMA Art. 57').replace('-Datenbank',' database');

  // ---------- data ----------
  const D = {}; const API = {};
  const j = async p => (await fetch(p)).json();
  async function data(){ if (!D.index) { const [i,c,m,s,g,x,mf] = await Promise.all([j('apis.json'), j('companies.json'), j('markets.json'), j('sources.json'), j('gaps.json'), j('search.json'), j('manufacturers.json')]);
      Object.assign(D, {index:i, companies:c, markets:m, sources:s, gaps:g, search:x, mfr:mf, mfrMap:Object.fromEntries(mf.map(e => [e.id, e]))}); } return D; }
  async function api(slug){ if (!API[slug]) API[slug] = await j(`api/${slug}.json`); return API[slug]; }

  // ---------- theme ----------
  const isDark = () => (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const setThemeLbl = () => $('#themeLbl').textContent = isDark() ? 'Light mode' : 'Dark mode';
  const saved = store.get('pl-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); setThemeLbl();
  $('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store.set('pl-theme', t); setThemeLbl(); });

  // ---------- shell: mobile nav, sheet, palette ----------
  const side = $('#side'), scrim = $('#scrim'), sheet = $('#sheet'), pal = $('#palette');
  let layer = null;
  function openLayer(name){ layer = name; scrim.classList.add('on'); if (name==='nav') { side.classList.add('open'); $('#menuBtn').setAttribute('aria-expanded','true'); } if (name==='sheet') sheet.classList.add('on'); if (name==='pal') pal.classList.add('on'); }
  function closeLayer(){ scrim.classList.remove('on'); side.classList.remove('open'); sheet.classList.remove('on'); pal.classList.remove('on'); $('#menuBtn').setAttribute('aria-expanded','false'); const was = layer; layer = null; return was; }
  scrim.addEventListener('click', closeLayer);
  $('#menuBtn').addEventListener('click', () => openLayer('nav'));
  side.addEventListener('click', e => { if (e.target.closest('a.navitem,a.logo') && layer === 'nav') closeLayer(); });
  $('#sheetClose').addEventListener('click', closeLayer);
  function showSheet(eyebrow, title, body){ $('#sheetEyebrow').textContent = eyebrow; $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = body; $('#sheetBody').scrollTop = 0; openLayer('sheet'); setTimeout(() => $('#sheetClose').focus(), 50); }

  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent); $('#kbdHint').textContent = mac ? '⌘K' : 'Ctrl K';
  let pItems = [], pSel = 0;
  function openPalette(){ const t = document.activeElement && document.activeElement.closest && document.activeElement.closest('#openPalette'); pal.style.setProperty('--pal-origin', t ? '0% 0%' : '50% 0%'); closeLayer(); openLayer('pal'); $('#pq').value = ''; renderPalette(); setTimeout(() => $('#pq').focus(), 30); }
  $('#openPalette').addEventListener('click', openPalette);
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); layer === 'pal' ? closeLayer() : openPalette(); }
    else if (e.key === 'Escape' && layer) { closeLayer(); }
    else if (e.key === '/' && !layer && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openPalette(); }
  });
  async function renderPalette(){
    const d = await data(); const q = $('#pq').value.trim().toLowerCase();
    const pages = [['overview','Dashboard'],['apis','APIs'],['companies','Companies'],['manufacturers','Manufacturers'],['markets','Markets'],['gaps','Gaps'],['sources','Sources']];
    const g = [];
    const A = d.index.apis.filter(a => !q || [a.inn,a.unii,a.cas,a.atc].some(x => (x||'').toLowerCase().includes(q))).slice(0, 6)
      .map(a => ({icon:'API', label:a.inn, cap:true, sub:`${a.countries} countries · ${fmt(a.products)} products`, go:'#api-'+a.slug}));
    const C = q ? findCompanies(d.search, q).slice(0, 7).map(([c, why]) => ({icon:(c.cc||'–'), label:c.n, sub:(mfrOf(c.id)?.primary === 'manufacturer' ? 'API manufacturer · ' : 'Company · ') + (why || (mfrOf(c.id)?.primary === 'manufacturer' ? `${fmt(mfrOf(c.id).dmf)} active US DMFs` : compSub(c))), company:c.id})) : [];
    const M = q ? d.markets.filter(m => m.name.toLowerCase().includes(q) || m.cc.toLowerCase() === q).slice(0, 4).map(m => ({icon:m.cc, label:m.name, sub:`${fmt(m.products)} products`, go:'#markets', market:m.cc})) : [];
    const P = pages.filter(([,l]) => !q || l.toLowerCase().includes(q)).map(([k,l]) => ({icon:'→', label:l, sub:'Page', go:'#'+k}));
    if (A.length) g.push(['APIs', A]); if (C.length) g.push(['Companies', C]); if (M.length) g.push(['Markets', M]); if (P.length) g.push(['Pages', P]);
    pItems = g.flatMap(x => x[1]); pSel = 0;
    let i = 0;
    $('#plist').innerHTML = pItems.length ? g.map(([name, items]) => `<div class="pgroup">${name}</div>` + items.map(it => `<button class="pitem" type="button" role="option" data-i="${i++}" aria-selected="false">
        <span class="picon" style="font-size:${it.icon.length>2?10:11}px;font-weight:700">${esc(it.icon)}</span><span class="${it.cap?'cap':''}">${esc(it.label)}</span><small>${esc(it.sub)}</small></button>`).join('')).join('')
      : `<div class="empty">No results for “${esc(q)}”. The pilot covers 20 APIs, ${fmt(d.search.length)} companies and ${d.markets.length} markets.</div>`;
    markSel();
  }
  function findCompanies(list, q){
    const out = [];
    for (const c of list) {
      const n = c.n.toLowerCase(); let score = 0, why = '';
      if (n.startsWith(q)) score = 4; else if (n.includes(q)) score = 3;
      else { const a = c.al.find(x => x.toLowerCase().includes(q)); if (a) { score = 2; why = `also: ${a}`; }
        else if ((c.p||'').toLowerCase().includes(q)) { score = 1; why = `Group ${c.p} (GLEIF)`; }
        else if ((c.g||'').toLowerCase().includes(q)) { score = 1; why = `Brand group ${c.g} (derived)`; } }

    if (t === 'supply') h = `<div class="toolbar"><span class="note">Manufacturer in the middle, potential buyers on the right (top 16 by score). Solid line = named in a document (EMA Annex IIA); dashed = derived.</span></div>
      <section class="card panel"><div id="chSupply" style="height:${Math.max(360, rows.length * 34 + 40)}px" role="img" aria-label="Supply chain: manufacturer and potential buyers"></div></section>`;
    if (t === 'signals') h = `<section class="card tbl">${rows.length ? `<table><thead><tr><th>Date</th><th>Signal</th><th>API</th><th>Source</th></tr></thead><tbody>${rows.map(x => `<tr><td class="num nw">${esc(x.date)}</td><td class="main">${esc(x.title)}</td><td class="cap">${esc(x.api||'–')}</td><td>${link(x.url,'FDA')} ${chip(x.st)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No new submissions in the last 12 months. New CEPs and status changes follow once the sources are connected.</div>'}</section>`;
    if (t === 'names') h = `<section class="card tbl"><table><thead><tr><th>Name / spelling</th><th>Kind</th><th>Seen</th><th>Sources</th><th>Status</th></tr></thead><tbody>
      <tr><td class="main">${esc(m.name)}</td><td>Normalised display name</td><td>–</td><td class="note">PharmaLens</td><td>${chip('derived')}</td></tr>
      ${rows.map(x => `<tr><td class="main">${esc(x.a)}</td><td>${esc({source_name:'Name in source',legal_name:'Most frequent spelling',spelling:'Variant',gleif_other_name:'GLEIF name',transliteration:'Transliteration',brand_group:'Brand group'}[x.k]||x.k)}</td><td class="num">${fmt(x.n)}</td><td class="note">${esc((x.src||[]).map(shortSrc).join(', '))}</td><td>${chip(x.st)}</td></tr>`).join('')}
      ${m.group.name ? `<tr><td class="main">${esc(m.group.name)}</td><td>Group</td><td>–</td><td class="note">${esc(m.group.basis||'')}</td><td>${chip(m.group.status)}</td></tr>` : ''}</tbody></table></section>`;
    if (t === 'gaps') h = `<section class="card tbl"><table><thead><tr><th>Area</th><th>What is missing and why</th></tr></thead><tbody>${rows.map(x => `<tr><td><span class="chip c-gap">${esc(x.area)}</span></td><td class="main" style="font-weight:500">${esc(x.reason)}</td></tr>`).join('')}</tbody></table></section>`;
    el.innerHTML = h;
    if (t === 'supply') echartsLib().then(() => drawSupply(m)).catch(() => $('#chSupply').innerHTML = '<div class="empty">Chart could not be loaded.</div>');
  }
  function drawSupply(m){
    const C = m.customers.slice(0, 16), H = $('#chSupply').clientHeight, W = $('#chSupply').clientWidth;
    const nodes = [{name:m.name, x:W*0.38, y:H/2, symbolSize:14, itemStyle:{color:css('--off-fg')}, label:{position:'left', color:css('--ink'), fontWeight:600}}]
      .concat(C.map((c, i) => ({name:c.name + ' ', x:W*0.72, y:20 + i * (H - 40) / Math.max(1, C.length - 1), symbolSize:8, itemStyle:{color:c.status==='official'?css('--off-fg'):css('--accent')}, label:{position:'right', color:css('--ink2')}, value:c.score})));
    const links = C.map(c => ({source:m.name, target:c.name + ' ', lineStyle:{type:c.status==='official'?'solid':'dashed', color:c.status==='official'?css('--off-fg'):css('--accent'), width:c.status==='official'?2:1.2, opacity:.7, curveness:.15}}));
    mount('#chSupply').setOption({...chartBase(), tooltip:{...chartBase().tooltip, formatter:p => p.dataType === 'edge' ? `${esc(p.data.source)} → ${esc(p.data.target)}<br>${C.find(c => c.name + ' ' === p.data.target)?.status === 'official' ? 'Named in EMA Annex IIA' : 'Derived – not confirmed'}` : esc(p.name)},
      series:[{type:'graph', layout:'none', roam:false, data:nodes, links, label:{show:true, fontSize:11, formatter:p => p.name.length > 40 ? p.name.slice(0, 39) + '…' : p.name}, emphasis:{focus:'adjacency'}}]});
  }
  async function exportMfr(m){
    if (!xlsxLib) xlsxLib = await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = no; document.head.appendChild(s); });
    const X = xlsxLib.utils, wb = X.book_new(), add = (n, rows) => X.book_append_sheet(wb, X.json_to_sheet(rows.length ? rows : [{Note:'No rows'}]), n);
    add('Portfolio', m.portfolio.flatMap(r => (r.dmf.length ? r.dmf : [{}]).map(x => ({API:r.api, Certificate:x.no ? 'US-DMF' : '', Number:x.no||'', Date:x.date||'', Status:x.cs||'', Data_status:x.st||'', Source:x.url||'', EU_products:r.eu_products, US_patent_expiry:r.patent?.us_expiry||'', Competing_API_makers:r.competitors, CEP:'not checked', JDMF:'not checked', KDMF:'not checked', WC:'not checked', WHO_PQ:'not checked', EU_GMP:'not checked'}))));
    add('Sites', m.sites.map(s => ({Address:s.addr, Country:s.cc, Products:s.products, Status:s.st, Source:s.url})));
    add('Compliance', m.compliance.map(x => ({Source:x.kind, Status:'not checked', Reason:x.reason})));
    add('Potential customers', m.customers.map(x => ({Company:x.name, APIs:x.apis.join(', '), Products:x.products, Markets:x.markets, Score:x.score, Reasons:x.reasons.join(' | '), Status:x.status, Evidence:x.evidence.map(e => e.url).join(' ')})));
    add('Signals', m.signals.map(x => ({Date:x.date, Signal:x.title, API:x.api, Status:x.st, Source:x.url})));
    add('Names & group', m.aliases.map(x => ({Name:x.a, Kind:x.k, Seen:x.n, Sources:(x.src||[]).join(', '), Status:x.st})).concat(m.group.name ? [{Name:m.group.name, Kind:'group', Status:m.group.status, Sources:m.group.basis}] : []));
    add('Gaps', m.gaps.map(x => ({Area:x.area, Reason:x.reason})));
    X.book_append_sheet(wb, X.aoa_to_sheet([['Manufacturer', m.name], ['Name in source', m.original], ['Country', m.country.cc || 'gap: ' + m.country.reason], ['Export', new Date().toISOString().slice(0,10)], ['Note', 'derived = inferred, not confirmed; not checked = source not connected. Every row has its source.']]), 'Info');
    xlsxLib.writeFile(wb, `PharmaLens_Manufacturer_${m.name.replace(/[^A-Za-z0-9]+/g,'_').slice(0,40)}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  async function pMarkets(keep){
    const d = await data(); crumbs([['Markets']]); setNav('markets');
    if (state.marketQ) { state.q = state.marketQ; pageq.value = state.marketQ; state.marketQ = ''; }
    const q = state.q.toLowerCase();
    const M = d.markets.filter(m => !q || m.name.toLowerCase().includes(q) || m.cc.toLowerCase() === q);
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Markets</h1><p>Authorisations per country. Manufacturers per product are available where a leaflet register is connected.</p></div></div>
      <section class="card tbl"><table><thead><tr><th>Market</th><th>Products</th><th>Authorisation holders</th><th>APIs</th><th style="min-width:220px">Manufacturer per product</th><th>Sources</th></tr></thead><tbody>
      ${M.map(m => { const cov = pct(m.with_mfr, m.products); return `<tr><td class="main"><span class="cc">${esc(m.cc)}</span> ${esc(m.name)}</td><td class="num">${fmt(m.products)}${m.vet?` <span class="note">(${m.vet} vet)</span>`:''}</td><td class="num">${fmt(m.mahs)}</td><td class="num">${m.apis}</td>
        <td>${m.with_mfr ? `<div style="display:flex;align-items:center;gap:10px"><div class="track" style="flex:1"><div class="fill" style="width:${cov}%"></div></div><span class="num" style="width:40px;text-align:right">${cov}%</span></div>` : '<span class="chip c-gap">Register only</span>'}</td>
        <td class="note">${m.sources.map(shortSrc).join(', ')}</td></tr>`; }).join('')}
      </tbody></table></section></div>`;
  }

  async function pGaps(keep){
    const d = await data(); crumbs([['Gaps']]); setNav('gaps');
    const q = state.q;
    const G = d.gaps.filter(g => has(g, q)); const byArea = {}; G.forEach(g => byArea[g.area] = (byArea[g.area]||0) + g.n);
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Gaps</h1><p>What is missing and why. Gaps are never filled with estimated values.</p></div></div>
      <div class="kpis">${Object.entries(byArea).sort((a,b) => b[1]-a[1]).map(([k,n]) => `<div class="card kpi"><span>${esc(AREA[k]||k)}</span><b class="num">${fmt(n)}</b></div>`).join('')}</div>
      <section class="card tbl" style="margin-top:16px"><table><thead><tr><th>Area</th><th>Reason</th><th>Cases</th><th>Where obtainable</th></tr></thead><tbody>
      ${G.map(g => `<tr><td><span class="chip c-gap">${esc(AREA[g.area]||g.area)}</span></td><td class="main" style="font-weight:550">${esc(g.reason)}</td><td class="num">${fmt(g.n)}</td><td>${/^https?:/.test(g.where||'') ? link(g.where,'Example') : esc(g.where||'–')}</td></tr>`).join('')}
      </tbody></table></section></div>`;
  }

  async function pSources(keep){
    const d = await data(); crumbs([['Sources']]); setNav('sources');
    const q = state.q; const LIGHT = {green:['Download / API','c-official'], yellow:['HTML allowed','c-gap'], red:['Not usable','c-red']};
    const cnt = {green:0,yellow:0,red:0}; d.sources.forEach(s => cnt[s.light]++);
    const S = d.sources.filter(s => (state.srcLight === 'all' || s.light === state.srcLight) && has({n:s.name,j:s.jur,r:s.reason,c:s.cat}, q));
    view.innerHTML = `<div class="${keep?'':'fade'}">
      <div class="page-head"><div><h1>Sources</h1><p>Every source with access method, robots.txt check and terms of use. Blocked sources are never bypassed.</p></div>
        <div class="seg" role="group" aria-label="Traffic light">${[['all',`All ${d.sources.length}`],['green',`Green ${cnt.green}`],['yellow',`Yellow ${cnt.yellow}`],['red',`Red ${cnt.red}`]].map(([k,l]) => `<button type="button" data-seg="srcLight" data-val="${k}" aria-pressed="${state.srcLight===k}">${l}</button>`).join('')}</div></div>
      <section class="card tbl"><table><thead><tr><th>Light</th><th>Source</th><th>Country</th><th>Access</th><th>Finding</th><th>Licence</th><th>Frequency</th></tr></thead><tbody>
      ${S.map(s => `<tr><td><span class="chip ${LIGHT[s.light][1]}"><span class="dot"></span>${LIGHT[s.light][0]}</span></td><td class="main">${link(s.url, s.name.replace(/^ALT /,''))}${s.name.startsWith('ALT ')?' <span class="chip c-neutral">Alternative route</span>':''}</td><td><span class="cc">${esc(s.jur||'–')}</span></td><td>${esc(s.access||'–')}</td><td class="note" style="min-width:240px">${esc(s.reason)}</td><td class="note" style="min-width:200px">${esc(s.licence||'–')}</td><td>${esc(s.freq||'–')}</td></tr>`).join('')}
      </tbody></table></section></div>`;
  }

  // ---------- routing ----------
  async function route(){
    closeLayer();
    const h = location.hash.replace('#','') || 'overview';
    const prevPage = route.page; let page = h.startsWith('api-') ? 'api' : h.startsWith('co-') ? 'co' : h.startsWith('mf-') ? 'mf' : h;
    if (page !== prevPage || page === 'api' || page === 'co' || page === 'mf') { state.q = ''; pageq.value = ''; state.limit = 60; state.sort = ['products', -1]; }
    if (page === 'api' && prevPage !== 'api') { state.tab = 'sites'; state.cc = ''; }
    if (page === 'co') { state.ctab = h.endsWith('~mah') ? 'mah' : 'cdmo'; state.cc = ''; }
    if (page === 'mf') { state.mtab = 'portfolio'; }
    route.page = page;
    const map = { overview:pOverview, apis:pApis, companies:pCompanies, manufacturers:pManufacturers, markets:pMarkets, gaps:pGaps, sources:pSources };
    pageq.placeholder = { overview:'Filter this page', apis:'Filter: API, UNII, CAS, ATC', companies:'Filter: company, alias, group', co:'Filter: product, holder, API', mf:'Filter: API, company, reason', manufacturers:'Filter: manufacturer, API, group', markets:'Filter: country', gaps:'Filter: reason', sources:'Filter: source or country', api:'Filter: company, product, number' }[page] || 'Filter this page';
    if (page === 'api') current = keep => pApi(h.slice(4), keep);
    else if (h.startsWith('co-')) { current = keep => pCompany(parseInt(h.slice(3)), keep); page = 'co'; }
    else if (h.startsWith('mf-')) { current = keep => pManufacturer(+h.slice(3), keep); }
    else current = map[page] || pOverview;
    await current();
    window.scrollTo(0, 0);
  }
  data().then(d => {
    $('#nApis').textContent = d.index.apis.length; $('#nComp').textContent = fmt(d.search.filter(c => mfrOf(c.id)?.primary !== 'manufacturer').length); $('#nMf').textContent = fmt(d.mfr.length); $('#nMk').textContent = d.markets.length;
    $('#nGaps').textContent = fmt(d.index.totals.gaps); $('#nSrc').textContent = d.sources.length; $('#stand').textContent = 'Data as of ' + d.index.generated;
  });
  document.addEventListener('pointerover', e => { const el = e.target.closest('td.main,.lbl a,.sig-t,.site h3,.crumbs b,.trunc'); if (el && !el.title && el.scrollWidth > el.clientWidth + 1) el.title = el.textContent.trim(); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
